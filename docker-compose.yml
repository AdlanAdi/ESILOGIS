version: "3.9"

services:
  backend:
    build:
      context: ./ESILOGIS-BACK
      dockerfile: Dockerfile
    container_name: esilogis-back
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - ./ESILOGIS-BACK/.env
  frontend:
    build:
      context: ./ESILOGIS-FRONT
      dockerfile: Dockerfile
    container_name: esilogis-front
    restart: unless-stopped
    ports:
      - "3000:3000"

    depends_on:
      - backend

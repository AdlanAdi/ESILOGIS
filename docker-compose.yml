version: "3.9"

services:
  backend:
    build:
      context: ./ESILOGIS-BACK
      dockerfile: dockerfile
    container_name: esilogis-back
    # Tiny init as PID 1: reaps zombies and forwards signals to the app.
    init: true
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - ./ESILOGIS-BACK/.env
  frontend:
    build:
      context: ./ESILOGIS-FRONT
      dockerfile: dockerfile
    container_name: esilogis-front
    init: true
    restart: unless-stopped
    ports:
      - "3000:3000"

    depends_on:
      - backend
